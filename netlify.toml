# United Electrical Surplus — static site, no build step.
# The generated HTML is committed at the repo root; Netlify just serves it.
#   Base directory:    (leave EMPTY)
#   Build command:     (leave EMPTY)
#   Publish directory: .

[build]
  publish = "."

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
